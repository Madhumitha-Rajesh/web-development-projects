<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Admission Application</title>

    <link rel="stylesheet" href="style.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>
<body>

<div class="container">

    <div class="title">

        <i class="fa-solid fa-building-columns"></i>

        <h1>College Admission Portal</h1>

        <p>Fill in the details below to apply for admission.</p>

    </div>

    <form action="process.php" method="POST">

        <div class="row">

            <div class="input-box">

                <label>Full Name</label>

                <input
                type="text"
                name="fullname"
                placeholder="Enter your full name"
                required>

            </div>

            <div class="input-box">

                <label>Date of Birth</label>

                <input
                type="date"
                name="dob"
                required>

            </div>

        </div>

        <div class="row">

            <div class="input-box">

                <label>Email Address</label>

                <input
                type="email"
                name="email"
                placeholder="example@gmail.com"
                required>

            </div>

            <div class="input-box">

                <label>Mobile Number</label>

                <input
                type="tel"
                name="mobile"
                pattern="[0-9]{10}"
                placeholder="10-digit mobile number"
                required>

            </div>

        </div>

        <div class="row">

            <div class="input-box">

                <label>Gender</label>

                <select name="gender" required>

                    <option value="">Select Gender</option>

                    <option>Male</option>

                    <option>Female</option>

                    <option>Other</option>

                </select>

            </div>

            <div class="input-box">

                <label>Course Applying For</label>

                <select name="course" required>

                    <option value="">Select Course</option>

                    <option>B.Sc Computer Science</option>

                    <option>BCA</option>

                    <option>B.Sc Information Technology</option>

                    <option>B.Com</option>

                    <option>BBA</option>

                </select>

            </div>

        </div>

        <div class="row">

            <div class="input-box">

                <label>Higher Secondary Percentage</label>

                <input
                type="number"
                name="percentage"
                min="0"
                max="100"
                placeholder="Enter Percentage"
                required>

            </div>

            <div class="input-box">

                <label>City</label>

                <input
                type="text"
                name="city"
                placeholder="Enter your city"
                required>

            </div>

        </div>

        <div class="input-box">

            <label>Residential Address</label>

            <textarea
            name="address"
            rows="4"
            placeholder="Enter your address"
            required></textarea>

        </div>

        <div class="check">

            <input
            type="checkbox"
            required>

            <span>
                I hereby declare that the above information is true.
            </span>

        </div>

        <button type="submit">

            <i class="fa-solid fa-paper-plane"></i>

            Submit Application

        </button>

    </form>

</div>

</body>
</html>
