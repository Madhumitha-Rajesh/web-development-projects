<html>
<head>
<title>Event Registration Form</title>
</head>

<body bgcolor="lightyellow">

<center>

<h1><font color="darkblue"> EVENT REGISTRATION FORM </font></h1>

<hr color="blue" width="60%">


<form>

<br>
<table cellpadding="8">

<tr>
<td>Name:</td>
<td><input type="text"></td>
</tr>

<tr>
<td>Email:</td>
<td><input type="text"></td>
</tr>

<tr>
<td>Phone Number:</td>
<td><input type="text"></td>
</tr>

<tr>
<td>Gender:</td>
<td>
<input type="radio" name="gender"> Male
<input type="radio" name="gender"> Female
</td>
</tr>

<tr>
<td>Event Type:</td>
<td>
<input type="checkbox"> Workshop
<input type="checkbox"> Cultural Event
<input type="checkbox"> Sports
</td>
</tr>

<tr>
<td>Select Event:</td>
<td>
<select>
<option>Select Event</option>
<option>Dance Competition</option>
<option>Technical Workshop</option>
<option>Quiz Competition</option>
<option>Music Festival</option>
</select>
</td>
</tr>

<tr>
<td>Upload ID Card:</td>
<td>
<input type="file">
</td>
</tr>

<tr>
<td>Address:</td>
<td>
<textarea rows="3" cols="20"></textarea>
</td>
</tr>

<tr>
<td colspan="2" align="center">
<input type="submit" value="Register">
<input type="reset" value="Clear">
</td>
</tr>

</table>

</form>

<br>

<font color="green">
<b> Register Now and Be a Part of the Event! </b>
</font>

</center>

</body>
</html>
